[project]
name = "mimo-narrator"
version = "0.1.0"
description = "基于小米 MiMo TTS API 的大文本语音合成工具（切分 → 逐片合成 → 无缝拼接）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.14.0",
    "pydub>=0.25.1",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",
    "gradio>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
packages = ["utils"]
py-modules = ["main", "web_ui"]
